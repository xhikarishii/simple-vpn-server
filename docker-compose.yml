services:
  db:
    image: mariadb:10.11
    container_name: vpn-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: vpn_root_pass
      MYSQL_DATABASE: vpn_server
      MYSQL_USER: vpn_user
      MYSQL_PASSWORD: vpn_password
    volumes:
      - db-data:/var/lib/mysql

  vpn-server:
    build: .
    container_name: vpn-server
    privileged: true
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules:ro
    restart: always
    environment:
      - SERVER_ENDPOINT=your-public-ip-here
      - DB_HOST=127.0.0.1
      - DB_USER=vpn_user
      - DB_PASS=vpn_password
      - DB_NAME=vpn_server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: vpn-dashboard-nginx
    network_mode: host
    restart: always
    depends_on:
      - vpn-server

volumes:
  db-data:
