services:
  vpn-server:
    build: .
    container_name: vpn-server
    privileged: true
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules:ro
      - /dev/net/tun:/dev/net/tun
      - ./data:/data
    restart: always
    environment:
      - SERVER_ENDPOINT=${SERVER_ENDPOINT}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    cap_add:
      - NET_ADMIN
      - NET_RAW

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: vpn-dashboard-nginx
    network_mode: host
    restart: always
    environment:
      - BACKEND_HOST=127.0.0.1
      - NGINX_PORT=8877
    depends_on:
      - vpn-server
