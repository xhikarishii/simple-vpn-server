services:
  db:
    image: mariadb:10.11
    container_name: vpn-db
    restart: always
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh

  vpn-server:
    build: .
    container_name: vpn-server
    privileged: true
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules:ro
    restart: always
    environment:
      - SERVER_ENDPOINT="${SERVER_ENDPOINT}"
      - DB_HOST="${DB_HOST}"
      - DB_USER="${DB_USER}"
      - DB_PASS="${DB_PASS}"
      - DB_NAME="${DB_NAME}"
      - JWT_SECRET="${JWT_SECRET}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: vpn-dashboard-nginx
    network_mode: host
    restart: always
    depends_on:
      - vpn-server

volumes:
  db-data:
