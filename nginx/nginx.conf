server {
    # The dashboard now runs exclusively on HTTPS over the custom port (8877)
    listen ${NGINX_PORT} ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/live/dashboard.crt;
    ssl_certificate_key /etc/nginx/ssl/live/dashboard.key;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://${BACKEND_HOST}:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Optional: Redirect standard HTTPS (443) to the custom port if reached
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/live/dashboard.crt;
    ssl_certificate_key /etc/nginx/ssl/live/dashboard.key;
    return 301 https://$host:${NGINX_PORT}$request_uri;
}
